site_name: lsmesh
site_description: Convert ViennaLS/ViennaPS interfaces into simulation-ready meshes
repo_url: https://github.com/fjararibet/lsmesh
edit_uri: tree/main/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

nav:
  - Overview: index.md
  - Automatic mesh quality: quality.md
  - Lower-level options: options.md

exclude_docs: |
  /3d-*.md
  /automatic-meshing.md
  /local-feature-aware-sizing-plan.md
  /material-identities.md
  /publishing.md
  /sdk-viewer-presets.md
  /SUMMARY.md