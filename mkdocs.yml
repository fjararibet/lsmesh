site_name: lsmesh
site_description: Convert ViennaLS/ViennaPS interfaces into simulation-ready meshes
repo_url: https://github.com/fjararibet/lsmesh
edit_uri: tree/main/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            inherited_members: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Overview: index.md
  - Automatic mesh quality: quality.md
  - Lower-level options: options.md
  - Reference: reference.md

exclude_docs: |
  /3d-*.md
  /local-feature-aware-sizing-plan.md
  /material-identities.md
  /publishing.md
  /sdk-viewer-presets.md