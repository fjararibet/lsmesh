site_name: lsmesh
site_description: Convert ViennaLS/ViennaPS interfaces into simulation-ready meshes
repo_url: https://github.com/fjararibet/lsmesh
edit_uri: tree/main/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            merge_init_into_class: true
            inherited_members: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Overview: index.md
  - Automatic mesh quality: quality.md
  - Lower-level options: options.md
  - Reference: reference.md
  - Examples:
      - Overview: examples/index.md
      - Atomic layer deposition: examples/atomicLayerDeposition.md
      - Blazed grating etching: examples/blazedGratingsEtching.md
      - Bosch process: examples/boschProcess.md
      - Cantilever wet etching: examples/cantileverWetEtching.md
      - DRAM wiggling: examples/DRAMWiggling.md
      - Process emulation: examples/emulation.md
      - Faraday-cage etching: examples/faradayCageEtching.md
      - Fin oxidation: examples/finOxidation.md
      - GDS import: examples/GDSReader.md
      - Hole etching: examples/holeEtching.md
      - Ion-beam etching: examples/ionBeamEtching.md
      - LOCOS oxidation: examples/locosOxidation.md
      - Oxide regrowth: examples/oxideRegrowth.md
      - Selective epitaxy: examples/selectiveEpitaxy.md
      - SiGe selective etching: examples/SiGeSelectiveEtching.md
      - Simple etching: examples/simpleEtching.md
      - Sputter deposition: examples/sputterDeposition.md
      - Stack etching: examples/stackEtching.md
      - Step oxidation: examples/stepOxidation.md
      - TEOS trench deposition: examples/TEOSTrenchDeposition.md
      - Trench deposition: examples/trenchDeposition.md
      - Geometric trench deposition: examples/trenchDepositionGeometric.md
      - Trench oxidation: examples/trenchOxidation.md

exclude_docs: |
  /3d-*.md
  /local-feature-aware-sizing-plan.md
  /material-identities.md
  /publishing.md
  /sdk-viewer-presets.md
  /examples/**/*.vtu
  /examples/**/*.vtp
  /examples/**/CMakeLists.txt
  /examples/**/README.md